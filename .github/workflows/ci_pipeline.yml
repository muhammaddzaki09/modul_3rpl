name: Python CI Pipeline - Sistem Perpustakaan

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Mengambil Kode dari Repositori (Checkout)
        uses: actions/checkout@v4

      - name: 2. Menyiapkan Lingkungan Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 3. Menginstal Dependensi Sistem & Python
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb python3-tk
          python -m pip install --upgrade pip
          pip install flake8
          pip install -r requirements.txt

      - name: 4. Menjalankan Flake8 Linter
        run: |
          # Cek kesalahan sintaksis utama & variabel tidak terdefinisi (mematikan pipeline jika gagal)
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=env,venv,.git,__pycache__
          # Cek gaya penulisan PEP8 (hanya menampilkan peringatan tanpa membatalkan pipeline)
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics --exclude=env,venv,.git,__pycache__

      - name: 5. Menjalankan Automated Unit Testing (Pytest)
        run: |
          PYTHONPATH=. xvfb-run python -m pytest tests/ -v